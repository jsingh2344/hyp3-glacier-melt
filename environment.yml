name: hyp3-glacier-melt
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.10
  - pip
  - rasterio
  - numpy
  - dask
  - gdal
  - xarray
  - scipy
  - pandas
  - geopandas
  - tqdm
  # For packaging, and testing
  - setuptools_scm
  - pytest
  - netcdf4
  - pytest-console-scripts
  - pytest-cov
  # For running
  - hyp3lib>=3,<4
  # TODO: insert conda-forge dependencies as list here
  - pip:
      - -r requirements-static.txt
