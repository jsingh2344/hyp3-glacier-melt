name: Publish primary test image

on:
  push:
    branches:
      - codex/publish-primary-test

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-primary-test
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build primary image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.compatibility
          load: true
          platforms: linux/amd64
          tags: ghcr.io/jsingh2344/hyp3-glacier-melt:test-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=test-${{ github.sha }}
          cache-from: type=gha,scope=primary-compatibility
          cache-to: type=gha,mode=max,scope=primary-compatibility
      - name: Verify primary CLI and run tests in image
        env:
          IMAGE: ghcr.io/jsingh2344/hyp3-glacier-melt:test-${{ github.sha }}
        run: |
          docker run --rm "$IMAGE" --help
          docker run --rm --entrypoint conda \
            -v "$GITHUB_WORKSPACE/tests:/tests:ro" -w /tmp \
            "$IMAGE" run --no-capture-output -n hyp3-glacier-melt \
            python -m pytest /tests -q -p no:cacheprovider
      - name: Audit old, rebuilt and compatibility runtime dependencies
        env:
          IMAGE: ghcr.io/jsingh2344/hyp3-glacier-melt:test-${{ github.sha }}
        run: |
          mkdir -p runtime-audit
          for item in old:8da01181bbcecc0cbc09d3627551bd3eb421b562cd3e2b45a98d7a47fd2efcef rebuilt:60acfe1d0e4473bae24f63d969a5c74e1233d7722193cb9d413203a6566b0a75; do
            name="${item%%:*}"
            digest="${item#*:}"
            docker run --rm --entrypoint conda \
              -v "$GITHUB_WORKSPACE/tests:/tests:ro" \
              "ghcr.io/jsingh2344/hyp3-glacier-melt@sha256:$digest" \
              run --no-capture-output -n hyp3-glacier-melt \
              python /tests/runtime_audit.py > "runtime-audit/$name.json"
          done
          docker run --rm --entrypoint conda \
            -v "$GITHUB_WORKSPACE/tests:/tests:ro" "$IMAGE" \
            run --no-capture-output -n hyp3-glacier-melt \
            python /tests/runtime_audit.py > runtime-audit/compatibility.json
          python - <<'AUDIT'
          import json
          from pathlib import Path
          reports = {p.stem: json.loads(p.read_text()) for p in Path('runtime-audit').glob('*.json')}
          assert reports['old']['packages'] == reports['compatibility']['packages']
          assert reports['old']['python'] == reports['compatibility']['python']
          assert reports['old']['auth_source'] == reports['compatibility']['auth_source']
          for name, report in reports.items():
              print(name, report['python'].split()[0], {k: v for k, v in report['packages'].items() if k.lower().replace('-', '_') in ('asf_search', 'requests', 'urllib3', 'hyp3lib')})
          print('Confirmed compatibility image preserves all installed dependency versions and authentication implementation.')
          AUDIT
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-audit
          path: runtime-audit
      - name: Publish verified image under test
        env:
          IMAGE: ghcr.io/jsingh2344/hyp3-glacier-melt:test-${{ github.sha }}
        run: |
          docker push "$IMAGE"
          docker tag "$IMAGE" ghcr.io/jsingh2344/hyp3-glacier-melt:test
          docker push ghcr.io/jsingh2344/hyp3-glacier-melt:test
