name: Real glacier run

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  run-container:
    runs-on: self-hosted

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull ghcr.io/jsingh2344/hyp3-glacier-melt:test

      - name: Run glacier pipeline
        run: |
          mkdir -p /home/ubuntu/glacier-inputs/outputs
          docker run --rm \
            -v /home/ubuntu/glacier-inputs/datacubes:/data/datacubes \
            -v /home/ubuntu/glacier-inputs/outputs:/data/output \
            ghcr.io/jsingh2344/hyp3-glacier-melt:test \
            --datacube /data/datacubes/Kennicott_32607_S1_cube_VH_014_387.nc \
            --output-root /data/output
